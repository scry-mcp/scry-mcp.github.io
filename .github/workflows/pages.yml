name: Pages

# The site is built from the three repositories' main branches, cloned here, so it is as current as
# the last run: a push here, or a run started by hand after a server's documentation changed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A publish is never cancelled half-way (it can leave the site half-deployed); a newer run waits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The workflow's own token reaches only public repositories, which these have to be.
      - uses: actions/checkout@v7
        with: {repository: scry-mcp/scry-core, ref: main, path: repos/scry-core}
      - uses: actions/checkout@v7
        with: {repository: scry-mcp/scry-mame, ref: main, path: repos/scry-mame}
      - uses: actions/checkout@v7
        with: {repository: scry-mcp/scry-dosbox-x, ref: main, path: repos/scry-dosbox-x}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        timeout-minutes: 3
      - run: uv sync --locked
        timeout-minutes: 3
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy --strict .
      - run: uv run --locked pytest -q
      - run: uv run --locked scry-site repos --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
